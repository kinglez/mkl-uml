:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="399.34" y="129.087" fill="#000" font-size="13" textLength="185.072">A nonempty Cart is quotable.</text><text x="399.34" y="144.397" fill="#000" font-size="13" textLength="309.404">Each CartLine names one Product and a quantity.</text><text x="399.34" y="159.708" fill="#000" font-size="13" textLength="335.334">Cardinalities and values are specified in glossary.md.</text></g><g class="entity" data-qualified-name="GMN13" id="ent0014" data-source-line="26"><path d="M958.05,111.178 L958.05,151.799 A0,0 0 0 0 958.05,151.799 L1317.92,151.799 A0,0 0 0 0 1317.92,151.799 L1317.92,121.178 L1307.92,111.178 L1141.92,111.178 L1137.92,76.958 L1133.92,111.178 L958.05,111.178 A0,0 0 0 0 958.05,111.178" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1307.92,111.178 L1307.92,121.178 L1317.92,121.178 L1307.92,111.178" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="964.05" y="128.747" fill="#000" font-size="13" textLength="338.87">Product price comes from a trusted catalog snapshot.</text><text x="964.05" y="144.057" fill="#000" font-size="13" textLength="224.015">A client price is never authoritative.</text></g><g class="entity" data-qualified-name="GMN16" id="ent0017" data-source-line="30"><path d="M6,190.178 L6,230.799 A0,0 0 0 0 6,230.799 L333.338,230.799 A0,0 0 0 0 333.338,230.799 L333.338,200.178 L323.338,190.178 L173.92,190.178 L169.92,155.958 L165.92,190.178 L6,190.178 A0,0 0 0 0 6,190.178" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M323.338,190.178 L323.338,200.178 L333.338,200.178 L323.338,190.178" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="12" y="207.747" fill="#000" font-size="13" textLength="306.338">A PriceQuote is a read-only result, not an Order.</text><text x="12" y="223.057" fill="#000" font-size="13" textLength="256.623">An absent Coupon means zero discount.</text></g><!--link Cart to CartLine--><g class="link" data-entity-1="ent000